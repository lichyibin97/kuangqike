<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 时代的岗位 FDE</title>
  <desc id="desc">一张用于文章封面的抽象工作流图，表现 AI、岗位、流程和指标被连接起来。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ef"/>
      <stop offset="0.55" stop-color="#eaf2ef"/>
      <stop offset="1" stop-color="#f3efe8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.28" stroke="#94a3b8" stroke-width="1">
    <path d="M0 170H1600M0 310H1600M0 450H1600M0 590H1600M0 730H1600"/>
    <path d="M220 0V900M420 0V900M620 0V900M820 0V900M1020 0V900M1220 0V900M1420 0V900"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="150" y="138" width="1300" height="624" rx="28" fill="#fffdf8" stroke="#e5e7eb"/>
  </g>
  <g transform="translate(230 210)">
    <text x="0" y="0" fill="#111827" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="66" font-weight="700">AI 时代的岗位 FDE</text>
    <text x="0" y="76" fill="#334155" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="32">把模型放进真实岗位、真实流程和真实指标里</text>
  </g>
  <g transform="translate(245 390)">
    <rect x="0" y="0" width="220" height="96" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="110" y="58" text-anchor="middle" fill="#1d4ed8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700">模型</text>
    <rect x="330" y="0" width="220" height="96" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="440" y="58" text-anchor="middle" fill="#15803d" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700">岗位</text>
    <rect x="660" y="0" width="220" height="96" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="770" y="58" text-anchor="middle" fill="#c2410c" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700">流程</text>
    <rect x="990" y="0" width="220" height="96" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1100" y="58" text-anchor="middle" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700">ROI</text>
    <path d="M220 48H330M550 48H660M880 48H990" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="275" cy="48" r="9" fill="#2563eb"/>
    <circle cx="605" cy="48" r="9" fill="#16a34a"/>
    <circle cx="935" cy="48" r="9" fill="#f97316"/>
  </g>
  <g transform="translate(245 565)" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="0" width="1210" height="110" rx="18" fill="#111827"/>
    <text x="48" y="46" fill="#f9fafb" font-size="28" font-weight="700">审计 · 评估 · 部署</text>
    <text x="48" y="82" fill="#cbd5e1" font-size="22">先看清楚企业怎么运转，再决定 AI 放在哪个环节。</text>
  </g>
</svg>
