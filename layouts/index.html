{{- define "main" }}
<div class="home-hero">
  <h1>运动、认知、做事，在世界上留下痕迹。</h1>
</div>

<section class="home-posts">
  <h2>最近写的</h2>
  {{- range first 5 (where .Site.RegularPages "Type" "posts") }}
  <a class="post-row" href="{{ .RelPermalink }}">
    <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
    <span class="post-title">{{ .Title }}</span>
  </a>
  {{- end }}
  <a class="more-link" href="{{ "/posts/" | relURL }}">全部文章 →</a>
</section>
{{- end }}
